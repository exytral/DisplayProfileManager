name: Release
run-name: ${{ github.event.head_commit.message || github.ref_name }}
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $assemblyInfo = Get-Content -Raw -Path "DisplayProfileManager/Properties/AssemblyInfo.cs"
          $match = [regex]::Match($assemblyInfo, '\[assembly:\s*AssemblyInformationalVersion\("([^"]+)"\)\]')

          if (-not $match.Success) {
            throw "AssemblyInformationalVersion was not found in AssemblyInfo.cs."
          }

          $assemblyVersion = $match.Groups[1].Value
          if ($assemblyVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match AssemblyInformationalVersion $assemblyVersion."
          }

      - name: Restore
        run: dotnet restore DisplayProfileManager.sln

      - name: Run tests
        run: dotnet test DisplayProfileManager.Tests/DisplayProfileManager.Tests.csproj --configuration Release --no-restore -p:Platform=x64

      - name: Clean release build outputs
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue DisplayProfileManager/bin, DisplayProfileManager/obj
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue DisplayProfileManager.ShellExt/bin, DisplayProfileManager.ShellExt/obj

      - name: Build x64
        run: >
          msbuild DisplayProfileManager/DisplayProfileManager.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=false
          /p:SolutionDir="${{ github.workspace }}\"

      - name: Build x86
        run: >
          msbuild DisplayProfileManager/DisplayProfileManager.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=x86
          /p:RuntimeIdentifier=win-x86
          /p:SelfContained=false
          /p:SolutionDir="${{ github.workspace }}\"

      - name: Build ARM64
        run: >
          msbuild DisplayProfileManager/DisplayProfileManager.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=ARM64
          /p:RuntimeIdentifier=win-arm64
          /p:SelfContained=false
          /p:SolutionDir="${{ github.workspace }}\"

      - name: Build DisplayProfileManager.ShellExt x64
        run: >
          msbuild DisplayProfileManager.ShellExt/DisplayProfileManager.ShellExt.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:SolutionDir="${{ github.workspace }}\"

      - name: Build DisplayProfileManager.ShellExt x86
        run: >
          msbuild DisplayProfileManager.ShellExt/DisplayProfileManager.ShellExt.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:SolutionDir="${{ github.workspace }}\"

      - name: Build DisplayProfileManager.ShellExt ARM64
        run: >
          msbuild DisplayProfileManager.ShellExt/DisplayProfileManager.ShellExt.vcxproj
          /p:Configuration=Release
          /p:Platform=ARM64
          /p:SolutionDir="${{ github.workspace }}\"

      - name: Validate release architecture payloads
        shell: pwsh
        run: |
          function Get-PeMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "$Path is not a PE file."
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
              throw "$Path has an invalid PE header offset."
            }

            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
              throw "$Path has no PE signature."
            }

            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          $expectations = @(
            @{ Path='DisplayProfileManager/bin/x64/Release/DisplayProfileManager.exe'; Machine=0x8664 },
            @{ Path='DisplayProfileManager/bin/x64/Release/DisplayProfileManager.dll'; Machine=0x8664 },
            @{ Path='DisplayProfileManager/bin/x64/Release/ShellExt.dll'; Machine=0x8664 },
            @{ Path='DisplayProfileManager/bin/x86/Release/DisplayProfileManager.exe'; Machine=0x014c },
            @{ Path='DisplayProfileManager/bin/x86/Release/DisplayProfileManager.dll'; Machine=0x014c },
            @{ Path='DisplayProfileManager/bin/x86/Release/ShellExt.dll'; Machine=0x014c },
            @{ Path='DisplayProfileManager/bin/ARM64/Release/DisplayProfileManager.exe'; Machine=0xAA64 },
            @{ Path='DisplayProfileManager/bin/ARM64/Release/DisplayProfileManager.dll'; Machine=0xAA64 },
            @{ Path='DisplayProfileManager/bin/ARM64/Release/ShellExt.dll'; Machine=0xAA64 }
          )

          foreach ($item in $expectations) {
            if (-not (Test-Path $item.Path)) {
              throw "Missing release payload: $($item.Path)"
            }

            $machine = Get-PeMachine $item.Path
            Write-Host ("{0} => 0x{1:X4}" -f $item.Path, $machine)

            if ($machine -ne $item.Machine) {
              throw ("Architecture mismatch for {0}: expected 0x{1:X4}, got 0x{2:X4}" -f $item.Path, $item.Machine, $machine)
            }
          }

      - name: Package portable zips
        shell: pwsh
        run: |
          $exclude = @('*.pdb', '*.xml', '*.tmp', '*.log', '*.exp', '*.lib')
          $archs = @('x64', 'x86', 'ARM64')
          $version = "${{ github.ref_name }}".TrimStart('v')

          foreach ($arch in $archs) {
            $src  = "DisplayProfileManager/bin/$arch/Release"
            $dest = "dist/portable/$arch"

            New-Item -ItemType Directory -Force -Path $dest | Out-Null

            Get-ChildItem -Path $src -File | Where-Object {
              $name = $_.Name
              -not ($exclude | Where-Object { $name -like $_ })
            } | Copy-Item -Destination $dest

            $runtimes = Join-Path $src 'runtimes'
            if (Test-Path $runtimes) {
              Copy-Item -Path $runtimes -Destination $dest -Recurse -Force
            }

            Copy-Item -Path "LICENSE", "THIRD-PARTY-LICENSES.md" -Destination $dest

            $outArch = $arch.ToLower()
            $zip = "dist/DisplayProfileManager-$version-$outArch-Portable.zip"

            Compress-Archive -Path "$dest/*" -DestinationPath $zip
          }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"

      - name: Install PyInstaller and dependencies
        run: pip install -r DPMBuilder/requirements-build.txt

      - name: Verify Builder dependencies
        shell: pwsh
        run: |
          python -c "import sys; from importlib.metadata import version; import PyInstaller, pythoncom, win32com.client; assert sys.version_info[:3] == (3, 13, 15); assert PyInstaller.__version__ == '6.22.2'; assert version('pywin32') == '312'; assert version('pyinstaller-hooks-contrib') == '2026.7'; print('Builder dependency imports PASS')"
          pip check

      - name: Build DPMShortcutBuilder executable
        shell: pwsh
        run: |
          $env:PATH = "$env:pythonLocation;$env:pythonLocation\Scripts;$env:SystemRoot\System32;$env:SystemRoot"
          cd DPMBuilder
          python -m PyInstaller `
            --onefile `
            --windowed `
            --icon="icon.ico" `
            --name="DPMShortcutBuilder" `
            --exclude-module=win32ui `
            DPMShortcutBuilder.pyw

      - name: Validate DPMShortcutBuilder bundle dependencies
        shell: pwsh
        run: |
          $analysis = Get-Content "DPMBuilder/build/DPMShortcutBuilder/Analysis-00.toc" -Raw
          $package = Get-Content "DPMBuilder/build/DPMShortcutBuilder/PKG-00.toc" -Raw

          foreach ($required in @('win32com', 'pythoncom')) {
            if ($analysis -notmatch $required) {
              throw "DPMShortcutBuilder bundle is missing $required."
            }
          }

          foreach ($required in @(
            'pythoncom313.dll', 'pywintypes313.dll', 'tcl86t.dll', 'tk86t.dll',
            'libcrypto-3.dll', 'libffi-8.dll', 'zlib1.dll', '_bz2.pyd', '_lzma.pyd', '_decimal.pyd',
            'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll'
          )) {
            if ($package -notmatch [regex]::Escape($required)) {
              throw "DPMShortcutBuilder package is missing $required."
            }
          }

          foreach ($forbidden in @('win32ui.pyd', 'mfc140u.dll', 'ImageMagick', 'Java_Temurin')) {
            if ($analysis -match [regex]::Escape($forbidden) -or $package -match [regex]::Escape($forbidden)) {
              throw "DPMShortcutBuilder contains unexpected dependency: $forbidden"
            }
          }

      - name: Build DPMThemeBuilder executable
        shell: pwsh
        run: |
          $env:PATH = "$env:pythonLocation;$env:pythonLocation\Scripts;$env:SystemRoot\System32;$env:SystemRoot"
          cd DPMBuilder
          python -m PyInstaller `
            --onefile `
            --windowed `
            --icon="icon.ico" `
            --name="DPMThemeBuilder" `
            DPMThemeBuilder.pyw

      - name: Validate DPMThemeBuilder bundle dependencies
        shell: pwsh
        run: |
          $analysis = Get-Content "DPMBuilder/build/DPMThemeBuilder/Analysis-00.toc" -Raw
          $package = Get-Content "DPMBuilder/build/DPMThemeBuilder/PKG-00.toc" -Raw

          foreach ($required in @(
            'tcl86t.dll', 'tk86t.dll', 'libcrypto-3.dll', 'libssl-3.dll',
            'libffi-8.dll', 'zlib1.dll', '_bz2.pyd', '_lzma.pyd', '_decimal.pyd', 'VCRUNTIME140.dll'
          )) {
            if ($package -notmatch [regex]::Escape($required)) {
              throw "DPMThemeBuilder package is missing $required."
            }
          }

          foreach ($forbidden in @('ImageMagick', 'Java_Temurin')) {
            if ($analysis -match [regex]::Escape($forbidden) -or $package -match [regex]::Escape($forbidden)) {
              throw "DPMThemeBuilder contains unexpected dependency: $forbidden"
            }
          }

      - name: Validate Builder third-party licenses
        shell: pwsh
        run: |
          $noticePath = "DPMBuilder/THIRD-PARTY-LICENSES.md"
          if (-not (Test-Path $noticePath)) {
            throw "Builder third-party license document is missing."
          }

          $notice = Get-Content -Raw $noticePath
          foreach ($required in @(
            "PYTHON SOFTWARE FOUNDATION LICENSE VERSION 2",
            "bzip2/libbzip2 version 1.0.8",
            "libffi - Copyright",
            "Copyright (c) 2008-2024 Stefan Krah",
            "Apache License",
            "This software is copyrighted by the Regents of the University of",
            "Apple Inc. and other parties.",
            "XZ Utils Licensing",
            "Jean-loup Gailly and Mark Adler",
            "Bootloader Exception",
            "PyInstaller Community Hooks — runtime hooks",
            "Copyright (c) 2022, PyInstaller Development Team.",
            "Copyright (c) 1996-2008, Greg Stein and Mark Hammond.",
            "Copyright (c) 1994-2008, Mark Hammond",
            "Microsoft Visual C++ Runtime"
          )) {
            if (-not $notice.Contains($required)) {
              throw "Builder third-party license document is missing required notice text: $required"
            }
          }

      - name: Package Builder archives
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $env:VERSION = $env:VERSION.TrimStart('v')
          $builders = @(
            @{ Name = 'DPMShortcutBuilder'; Source = 'DPMBuilder/DPMShortcutBuilder.pyw' },
            @{ Name = 'DPMThemeBuilder'; Source = 'DPMBuilder/DPMThemeBuilder.pyw' }
          )

          foreach ($builder in $builders) {
            $name = $builder.Name
            $stage = "dist/builders/$name"
            $archive = "dist/builders/$name-$env:VERSION.zip"

            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $stage
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "DPMBuilder/dist/$name.exe" -Destination $stage
            Copy-Item $builder.Source -Destination $stage
            Copy-Item "DPMBuilder/LICENSE" -Destination $stage
            Copy-Item "DPMBuilder/THIRD-PARTY-LICENSES.md" -Destination $stage

            Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
            if (-not (Test-Path $archive)) {
              throw "Builder archive was not created: $archive"
            }

            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
            try {
              $actualEntries = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            }
            finally {
              $zip.Dispose()
            }

            $expectedEntries = @(
              "$name.exe",
              "$name.pyw",
              "LICENSE",
              "THIRD-PARTY-LICENSES.md"
            ) | Sort-Object

            if (Compare-Object $expectedEntries $actualEntries) {
              Write-Host 'Expected archive entries:'
              $expectedEntries
              Write-Host 'Actual archive entries:'
              $actualEntries
              throw "Builder archive contents are incorrect: $archive"
            }
          }

      - name: Build installers
        shell: pwsh
        run: |
          $iscc    = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $iss     = "DisplayProfileManager/DisplayProfileManager.Setup.iss"
          $archs   = @('x64', 'x86', 'ARM64')
          $tag     = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')

          foreach ($arch in $archs) {
            $targetArch = $arch.ToLower()
            $outputName = "DisplayProfileManager-$version-$targetArch-Setup"

            & $iscc $iss `
              "/DTargetArch=$targetArch" `
              "/DExpectedTargetArch=$targetArch" `
              "/DMyAppVersion=$tag" `
              "/O$PWD/dist/installers" `
              "/F$outputName"

            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          $expectedInstallers = @('x64', 'x86', 'arm64') | ForEach-Object {
            "dist/installers/DisplayProfileManager-$version-$_-Setup.exe"
          }

          foreach ($installer in $expectedInstallers) {
            if (-not (Test-Path $installer)) {
              throw "Missing installer: $installer"
            }
          }

          $hashes = $expectedInstallers | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_).Hash
            Write-Host "$_ => $hash"
            $hash
          }

          if (($hashes | Select-Object -Unique).Count -ne $expectedInstallers.Count) {
            throw "Architecture installers are not distinct binaries."
          }

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/installers/*.exe
            dist/*.zip
            dist/builders/*.zip

      - name: Parse Release File
        id: parse_release
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Path "RELEASE-NOTES.md"
          $version = "${{ github.ref_name }}".TrimStart('v')

          $versionPattern = '(?ms)^##\s+' + [regex]::Escape($version) + '\b.*?(?=^---\s*$|\z)'
          $versionMatch = [regex]::Match($content, $versionPattern)

          if (-not $versionMatch.Success) {
            throw "No release-notes section found for version $version."
          }

          $versionSection = $versionMatch.Value.Trim()

          $cumulativePattern = '(?ms)^##\s+[^\r\n]+\r?\n.*?(?=^---\s*$)'
          $cumulativeMatch = [regex]::Match($content, $cumulativePattern)

          if (-not $cumulativeMatch.Success) {
            throw "No cumulative release-notes overview found."
          }

          $cumulativeSection = $cumulativeMatch.Value.Trim()

          $footerPattern = '(?ms)^For a full technical breakdown, see \[CHANGELOG\.md\]\(CHANGELOG\.md\)\.\s*\r?\n\r?\n^---\s*$\r?\n\r?\n^#\s+Current Release Assets\s*\r?\n.*\z'
          $footerMatch = [regex]::Match($content, $footerPattern)

          if (-not $footerMatch.Success) {
            throw "No release footer or Current Release Assets block found."
          }

          $footerSection = $footerMatch.Value.Trim()

          $section = @(
            $cumulativeSection
            ""
            "---"
            ""
            $versionSection
            ""
            $footerSection
          ) -join "`r`n"

          $section = $section -replace '\{\{VERSION\}\}', $version

          if ($cumulativeSection -match '(?s)^##\s+(.*?)\r?\n') {
            $cumulativeTitle = $matches[1].Trim()
          } else {
            throw "Cumulative release-notes heading not found."
          }

          $tag = "${{ github.ref_name }}"
          $finalTitle = "${tag}: $cumulativeTitle"

          $section | Out-File -FilePath "RELEASE-BODY.md" -Encoding utf8
          echo "release_title=$finalTitle" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.parse_release.outputs.release_title }}
          body_path: RELEASE-BODY.md
          generate_release_notes: false
          files: |
            dist/installers/*.exe
            dist/*.zip
            dist/builders/*.zip

      - name: Downgrade previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ github.ref_name }}"
          $currentVersion = $currentTag.TrimStart('v')
          $tags = gh api repos/${{ github.repository }}/tags --paginate --jq '.[].name' |
            Where-Object { $_ -match '^v?\d+\.\d+\.\d+$' } |
            ForEach-Object {
              [PSCustomObject]@{
                Tag = $_
                Version = $_.TrimStart('v')
              }
            } |
            Sort-Object { [version]$_.Version } -Descending

          $previous = $tags |
            Where-Object { [version]$_.Version -lt [version]$currentVersion } |
            Select-Object -First 1

          if (-not $previous) {
            Write-Host "No previous semver tag found."
            exit 0
          }

          $previousVersion = $previous.Version
          $previousTag = $previous.Tag
          $releaseJson = gh api "repos/${{ github.repository }}/releases/tags/$previousTag" 2>$null
          if (-not $releaseJson) {
            Write-Host "No published release found for $previousTag."
            exit 0
          }

          $release = $releaseJson | ConvertFrom-Json
          $body = [string]$release.body

          $versionHeadingPattern = '(?m)^##\s+' + [regex]::Escape($previousVersion) + '\b.*$'
          $versionHeadingMatch = [regex]::Match($body, $versionHeadingPattern)
          if (-not $versionHeadingMatch.Success) {
            throw "Could not locate the $previousVersion version-specific heading in its published release body."
          }

          $firstHeadingMatch = [regex]::Match($body, '(?m)^##\s+.*$')
          if ($firstHeadingMatch.Success -and $firstHeadingMatch.Index -eq $versionHeadingMatch.Index) {
            Write-Host "Release $previousVersion is already historical-only; leaving it unchanged."
            exit 0
          }

          $newBody = $body.Substring($versionHeadingMatch.Index).Trim()

          $titleMatch = [regex]::Match($versionHeadingMatch.Value, '^##\s+' + [regex]::Escape($previousVersion) + '\s*[—\-:]*\s*(.*)$')
          if (-not $titleMatch.Success) {
            throw "Could not extract the previous release's version-specific title."
          }
          $versionTitle = $titleMatch.Groups[1].Value.Trim()

          $releaseTitle = if ($versionTitle) { "$previousVersion`: $versionTitle" } else { "$previousVersion" }
          $bodyPath = "PREVIOUS-RELEASE-BODY.md"
          $newBody | Out-File -FilePath $bodyPath -Encoding utf8

          $payload = @{
            name = $releaseTitle
            body = Get-Content -Raw $bodyPath
          } | ConvertTo-Json -Compress

          $payloadPath = "PREVIOUS-RELEASE-PATCH.json"
          $payload | Out-File -FilePath $payloadPath -Encoding utf8

          gh api --method PATCH "repos/${{ github.repository }}/releases/$($release.id)" `
            --input $payloadPath

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to downgrade release $previousVersion."
          }