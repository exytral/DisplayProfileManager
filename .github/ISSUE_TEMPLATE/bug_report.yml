name: Bug Report
description: Report a bug or unexpected behavior in Display Profile Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check [existing issues](../../issues) to see if this has already been reported.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened? Is this reproducible or intermittent?
      placeholder: "Expected: profile applied cleanly. Actual: second monitor stayed off."
    validations:
      required: true

  - type: input
    id: source-profile
    attributes:
      label: Source profile (switching from)
      description: The profile or specific display/application state you were switching away from, if applicable.
      placeholder: "e.g. Desktop profile, 2 monitors connected with the TV powered off, etc"
    validations:
      required: false

  - type: input
    id: dest-profile
    attributes:
      label: Destination profile (switching to)
      description: The profile you were applying when the issue occurred.
      placeholder: "e.g. TV Setup"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Application log
      description: Attach the log file for the day the issue occurred. Logs are stored at `%AppData%\Roaming\DisplayProfileManager\Logs\`.
      placeholder: "Attach the relevant daily log file."
    validations:
      required: true

  - type: textarea
    id: profiles
    attributes:
      label: Profile files
      description: Attach the destination `.dpm` profile. Also attach the source `.dpm` profile when a source profile applies. Profile files are stored at `%AppData%\Roaming\DisplayProfileManager\Profiles\`.
      placeholder: "Attach the requested .dpm files."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Steps to reproduce, relevant hardware or application setup, and any other observations that may help diagnose the problem.
    validations:
      required: false